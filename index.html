<style>

.card{
 width:100%; max-width:430px; background:white; border-radius:24px;
 padding:38px 24px; text-align:center;

<main class="card">

<script>
document.getElementById('telegram-link').addEventListener('click', function() {

    fbq('trackCustom', 'TelegramClick', {destination:'telegram'});

});
